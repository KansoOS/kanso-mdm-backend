
name: Build and Deploy

on:
  workflow_run:
    workflows: ["Check Main"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: kanso-test-deploy
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Push Docker

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.value }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set image name
        id: image
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "value=ghcr.io/${REPO,,}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Pull image on test server
    needs: publish

    runs-on: [self-hosted, linux, kanso-test]
    environment: test

    steps:
      - name: Pull image from GHCR
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail

          echo "Pulling $IMAGE"

          docker pull "$IMAGE"

          echo "Docker image downloaded successfully"

      - name: Verify downloaded image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          docker image inspect "$IMAGE" \
            --format 'Image: {{.RepoTags}} | ID: {{.Id}}'

          echo "Deployment download completed"
