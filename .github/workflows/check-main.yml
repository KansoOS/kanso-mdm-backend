name: Check Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate NestJS backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint (when defined)
        run: npm run lint --if-present

      - name: Unit tests (when defined)
        run: npm run test --if-present -- --runInBand --passWithNoTests

      - name: Compile NestJS
        run: npm run build
