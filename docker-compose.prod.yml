name: kanso-mdm

services:
  db:
    image: postgres:16-alpine
    container_name: kanso-mdm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kanso-mdm-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      PORT: ${APP_PORT:-3000}
    ports:
      - '${APP_PORT:-3000}:3000'
    networks: [backend]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  # ponytail: adminer only via `--profile tools`, pas en prod
  adminer:
    image: adminer:4
    container_name: kanso-mdm-adminer
    profiles: [tools]
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

volumes:
  db_data:
    name: kanso-mdm-db-data

networks:
  backend:
    name: kanso-mdm-net
